services:
  postgres:
    image: postgres:16-alpine
    container_name: brandos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: brandos
      POSTGRES_PASSWORD: brandos_password
      POSTGRES_DB: brandos
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brandos -d brandos"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  redis:
    image: redis:7-alpine
    container_name: brandos-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 3s

volumes:
  postgres_data:
    name: brandos_postgres_data
  redis_data:
    name: brandos_redis_data
